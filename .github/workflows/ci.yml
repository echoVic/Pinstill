name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Windows cross-compile
        run: GOOS=windows GOARCH=amd64 go build ./...

  web:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci
      - name: Tooling and frontend regression tests (synthetic)
        run: node --test work/tests/*.test.mjs frontend/tests/*.test.mjs
      - name: Shell syntax
        run: bash -n work/e2e.sh
      - run: npm run typecheck
      - run: npm run build:web
