<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tupen — 选择截图区域</title>
<style>
  :root {
    --amber: #f3a24e;
    --paper: #f2eee4;
    --mask: rgba(12, 12, 11, 0.45);
    --font: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    cursor: crosshair;
    user-select: none;
    -webkit-user-select: none;
    font-family: var(--font);
  }
  [hidden] { display: none !important; }

  .dim { position: fixed; inset: 0; background: var(--mask); }

  .selection {
    position: fixed;
    background: transparent;
    border: 1px solid var(--amber);
    box-shadow: 0 0 0 200vmax var(--mask);
    pointer-events: none;
  }
  .selection::before,
  .selection::after {
    content: "";
    position: absolute;
    width: 11px;
    height: 11px;
    border: 0 solid #fffaf0;
  }
  .selection::before { left: -1px; top: -1px; border-width: 2px 0 0 2px; }
  .selection::after { right: -1px; bottom: -1px; border-width: 0 2px 2px 0; }

  .crosshair {
    position: fixed;
    background: rgba(255, 250, 240, 0.5);
    pointer-events: none;
  }
  .crosshair.v { top: 0; width: 1px; height: 100vh; }
  .crosshair.h { left: 0; height: 1px; width: 100vw; }

  .size-badge {
    position: fixed;
    padding: 5px 9px;
    border-radius: 6px;
    background: var(--amber);
    color: #21170d;
    font: 700 12px/1.2 var(--font);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    pointer-events: none;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.38);
  }

  .hint {
    position: fixed;
    left: 50%;
    top: 38px;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 10px 16px;
    border: 1px solid rgba(242, 238, 228, 0.16);
    border-radius: 10px;
    background: rgba(20, 20, 18, 0.74);
    color: var(--paper);
    font-size: 13px;
    line-height: 1.4;
    pointer-events: none;
    backdrop-filter: blur(8px);
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.35);
  }
  .hint-key {
    padding: 2px 7px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 5px;
    background: #2f2d26;
    color: #ece5d8;
    font-size: 11px;
  }
  .hint-sep { color: #8e8a7e; }
</style>
</head>
<body>
  <div class="dim" id="dim"></div>
  <div class="selection" id="selection" hidden></div>
  <div class="crosshair v" id="crosshairV" hidden></div>
  <div class="crosshair h" id="crosshairH" hidden></div>
  <div class="size-badge" id="sizeBadge" hidden></div>
  <div class="hint" id="hint">
    <span class="hint-key">拖动</span> 选择截图区域
    <span class="hint-sep">·</span>
    <span class="hint-key">Esc</span> 取消
  </div>
  <script type="module" src="/src/overlay.ts"></script>
</body>
</html>
