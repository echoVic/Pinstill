<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pinstill — 桌面贴图</title>
<style>
  :root {
    --paper: #f2eee4;
    --ink: #1a1915;
    --amber: #f3a24e;
    --menu: #201f1b;
    --menu-hover: #302e27;
    --font: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
    user-select: none;
    -webkit-user-select: none;
    font-family: var(--font);
  }
  [hidden] { display: none !important; }

  /* The whole image is the window's drag region (MyGo --app-region: drag). */
  .pin-window {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--paper);
    --app-region: drag;
  }
  .pin-window img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: fill;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .pin-window.bordered::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 0 1px rgba(243, 162, 78, 0.9);
  }

  .pin-close {
    --app-region: no-drag;
    position: absolute;
    top: 6px;
    right: 6px;
    width: 24px;
    height: 24px;
    padding: 0;
    display: grid;
    place-items: center;
    border: 1px solid rgba(26, 25, 21, 0.2);
    border-radius: 7px;
    background: rgba(250, 247, 240, 0.86);
    color: #36332c;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.12s ease, background 0.12s ease;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.22);
    z-index: 1;
  }
  .pin-close svg { width: 14px; height: 14px; }
  .pin-window:hover .pin-close,
  .pin-close:focus-visible { opacity: 1; }
  .pin-close:hover { background: #fffaf0; }
  .pin-close:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  /* Bottom-right resize grip: page-driven, keeps the aspect ratio. */
  .pin-resize {
    --app-region: no-drag;
    position: absolute;
    right: 0;
    bottom: 0;
    width: 20px;
    height: 20px;
    display: grid;
    place-items: center;
    color: rgba(26, 25, 21, 0.55);
    cursor: nwse-resize;
    opacity: 0;
    transition: opacity 0.12s ease;
    z-index: 1;
  }
  .pin-resize svg { width: 14px; height: 14px; }
  .pin-window:hover .pin-resize,
  .pin-resize:focus-visible { opacity: 1; }
  .pin-resize:focus-visible { outline: 2px solid var(--amber); outline-offset: -2px; }

  /* Dark menu, matching the app's design language. */
  .pin-menu {
    position: absolute;
    min-width: min(186px, calc(100% - 8px));
    max-width: calc(100% - 8px);
    max-height: calc(100% - 8px);
    overflow-y: auto;
    padding: 5px;
    border: 1px solid rgba(242, 238, 228, 0.12);
    border-radius: 9px;
    background: var(--menu);
    color: #f0ebe1;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    --app-region: no-drag;
    z-index: 5;
  }
  .pin-menu-state {
    padding: 5px 10px 7px;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #9c9487;
  }
  .pin-menu button {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 7px 10px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: inherit;
    font: 400 12px/1.3 var(--font);
    text-align: left;
    cursor: pointer;
    white-space: nowrap;
  }
  .pin-menu button svg { width: 14px; height: 14px; flex-shrink: 0; opacity: 0.8; }
  .pin-menu button:hover { background: var(--menu-hover); }
  .pin-menu button:focus-visible { outline: 2px solid var(--amber); outline-offset: -2px; }
  .pin-menu button .pin-menu-hint { margin-left: auto; padding-left: 16px; color: #8f887b; font-size: 10px; }
  .pin-menu-sep { display: block; height: 1px; margin: 4px 6px; background: rgba(242, 238, 228, 0.12); }

  .pin-toast {
    position: absolute;
    left: 50%;
    bottom: 10px;
    transform: translateX(-50%);
    max-width: calc(100% - 24px);
    padding: 6px 11px;
    border-radius: 7px;
    background: rgba(20, 20, 18, 0.86);
    color: #f2eee4;
    font-size: 11px;
    line-height: 1.4;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    pointer-events: none;
    z-index: 6;
  }

  .pin-error {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 16px;
    text-align: center;
    font-size: 12px;
    line-height: 1.6;
    color: #6f6a5e;
    background: var(--paper);
  }
</style>
</head>
<body>
  <div class="pin-window" id="pinWindow">
    <img id="pinImage" alt="固定到桌面的截图" />
    <button type="button" class="pin-close" id="pinClose" aria-label="关闭贴图" title="关闭贴图（Esc）">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
    <div class="pin-resize" id="pinResize" role="slider" aria-label="调整贴图大小" tabindex="-1">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 15 15 21"/><path d="M21 8 8 21"/></svg>
    </div>
    <div class="pin-menu" id="pinMenu" role="menu" aria-label="贴图操作" hidden>
      <div class="pin-menu-state" id="pinMenuState">桌面贴图</div>
      <button type="button" role="menuitem" data-menu-action="copy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span>复制</span><span class="pin-menu-hint">双击</span>
      </button>
      <button type="button" role="menuitem" data-menu-action="save">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
        <span>保存</span>
      </button>
      <span class="pin-menu-sep" aria-hidden="true"></span>
      <button type="button" role="menuitem" data-menu-action="opacity-up">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.9 4.9 1.4 1.4"/><path d="m17.7 17.7 1.4 1.4"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m4.9 19.1 1.4-1.4"/><path d="m17.7 6.3 1.4-1.4"/></svg>
        <span>透明度 +10%</span><span class="pin-menu-hint">⌘ 滚轮</span>
      </button>
      <button type="button" role="menuitem" data-menu-action="opacity-down">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8"/><path d="M8 12h8"/></svg>
        <span>透明度 −10%</span>
      </button>
      <button type="button" role="menuitem" data-menu-action="reset-size">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V3h4"/><path d="M21 7V3h-4"/><path d="M3 17v4h4"/><path d="M21 17v4h-4"/><path d="M7 12h10"/></svg>
        <span>原始大小</span>
      </button>
      <span class="pin-menu-sep" aria-hidden="true"></span>
      <button type="button" role="menuitem" data-menu-action="close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        <span>关闭贴图</span><span class="pin-menu-hint">Esc</span>
      </button>
    </div>
    <div class="pin-toast" id="pinToast" role="status" hidden></div>
  </div>
  <div class="pin-error" id="pinError">正在载入贴图…</div>
  <script type="module" src="/src/pin.ts"></script>
</body>
</html>
