<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tupen — 固定贴图</title>
<style>
  :root {
    --font: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #f2eee4;
    color: #1a1915;
    user-select: none;
    -webkit-user-select: none;
    font-family: var(--font);
  }
  [hidden] { display: none !important; }

  .pin-window {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #f2eee4;
    --app-region: drag;
  }
  .pin-window img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: fill;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .pin-window.bordered { box-shadow: inset 0 0 0 1px rgba(243, 162, 78, 0.9); }

  .pin-close {
    --app-region: no-drag;
    position: absolute;
    top: 6px;
    right: 6px;
    width: 24px;
    height: 24px;
    padding: 0;
    display: grid;
    place-items: center;
    border: 1px solid rgba(255, 255, 255, 0.26);
    border-radius: 7px;
    background: rgba(20, 20, 18, 0.7);
    color: #f2eee4;
    font: 400 14px/1 var(--font);
    cursor: pointer;
    opacity: 0.55;
    transition: opacity 0.12s ease;
  }
  .pin-close:hover,
  .pin-close:focus-visible { opacity: 1; outline: 2px solid rgba(243, 162, 78, 0.65); outline-offset: 2px; }

  .pin-error {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 16px;
    text-align: center;
    font-size: 12px;
    line-height: 1.6;
    color: #6f6a5e;
  }
</style>
</head>
<body>
  <div class="pin-window" id="pinWindow">
    <img id="pinImage" alt="固定到屏幕的截图" />
    <button type="button" class="pin-close" id="pinClose" aria-label="关闭贴图">×</button>
  </div>
  <div class="pin-error" id="pinError">正在载入贴图…</div>
  <script type="module" src="/src/pin.ts"></script>
</body>
</html>
