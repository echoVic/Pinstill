<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pinstill — 截图快捷操作</title>
<style>
  :root {
    color-scheme: dark;
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #f2eee4;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { user-select: none; -webkit-user-select: none; }
  .quick-card {
    position: fixed;
    inset: 0;
    display: grid;
    grid-template-columns: 80px minmax(0, 1fr);
    align-items: center;
    gap: 12px;
    padding: 11px;
    border: 1px solid #f2eee438;
    border-radius: 12px;
    background: #211f1a;
  }
  .quick-thumbnail {
    display: block;
    width: 80px;
    height: 80px;
    object-fit: contain;
    border: 1px solid #f2eee421;
    border-radius: 7px;
    background: #15140f;
    pointer-events: none;
  }
  .quick-content { display: grid; align-content: center; gap: 6px; min-width: 0; }
  .quick-header { display: flex; align-items: center; gap: 6px; }
  .quick-summary {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 12px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  button {
    border: 1px solid #f2eee42b;
    border-radius: 6px;
    padding: 4px;
    min-height: 29px;
    background: #302e26;
    color: inherit;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.2;
    white-space: nowrap;
    cursor: pointer;
  }
  button:hover:not([disabled]) { background: #403c30; }
  button:disabled { opacity: .55; cursor: default; }
  button:focus-visible { outline: 2px solid #f3a24e; outline-offset: 2px; }
  .quick-actions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
  .quick-actions [data-quick-action="pin"] { color: #ffce97; }
  .quick-close {
    position: relative;
    width: 22px;
    height: 22px;
    min-height: 22px;
    border-color: transparent;
    background: transparent;
    color: #bcb4a6;
  }
  .quick-close::before, .quick-close::after {
    content: "";
    position: absolute;
    left: 5px;
    top: 9px;
    width: 10px;
    height: 1.5px;
    background: currentColor;
    transform: rotate(45deg);
  }
  .quick-close::after { transform: rotate(-45deg); }
  .quick-status {
    min-height: 15px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 11px;
    line-height: 15px;
    color: #bcb4a6;
  }
  .quick-status[data-error] { color: #ffb2a4; }
  @media (max-width: 248px) {
    .quick-card { grid-template-columns: minmax(0, 1fr); }
    .quick-thumbnail { display: none; }
  }
</style>
</head>
<body>
  <section class="quick-card" id="quickCard" aria-label="截图快捷操作" hidden>
    <img class="quick-thumbnail" id="quickThumbnail" alt="截图预览" />
    <div class="quick-content">
      <header class="quick-header">
        <div class="quick-summary" id="quickSummary"></div>
        <button class="quick-close" id="quickClose" type="button" aria-label="关闭快捷操作" title="关闭（Esc）"></button>
      </header>
      <div class="quick-actions">
        <button type="button" data-quick-action="copy">复制</button>
        <button type="button" data-quick-action="save">保存</button>
        <button type="button" data-quick-action="pin">贴图</button>
        <button type="button" data-quick-action="hang">晾图</button>
      </div>
      <div class="quick-status" id="quickStatus" role="status" aria-live="polite"></div>
    </div>
  </section>
  <script type="module" src="/src/quick.ts"></script>
</body>
</html>
