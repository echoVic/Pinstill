<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pinstill — 滚动截图</title>
<style>
  :root {
    --amber: #f3a24e;
    --paper: #f2eee4;
    --panel: #201f1b;
    --panel2: #2f2d26;
    --muted: #9c9487;
    --ease-out: cubic-bezier(.22,.61,.36,1);
    --font: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    color: var(--paper);
    user-select: none;
    -webkit-user-select: none;
    font-family: var(--font);
  }
  [hidden] { display: none !important; }

  /* The whole bar is the window's drag region (MyGo --app-region: drag). */
  .scroll-bar {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 4px;
    padding: 6px 9px;
    border: 1px solid rgba(242, 238, 228, 0.12);
    border-radius: 10px;
    background: var(--panel);
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.4);
    --app-region: drag;
    animation: bar-in 160ms var(--ease-out) both;
  }
  .scroll-row {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .scroll-status {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 600;
    line-height: 1.3;
    color: #f0ebe1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .scroll-status::before {
    content: "";
    flex: 0 0 6px;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 0 3px rgba(243, 162, 78, 0.16);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .scroll-status[data-status="paused"]::before { animation: none; background: #d7c08d; box-shadow: none; }
  .scroll-status[data-status="stalled"]::before { animation: none; background: #b9ae9a; box-shadow: none; }
  .scroll-status[data-status="max"]::before { animation: none; background: #a8c7a0; box-shadow: none; }
  .scroll-status[data-status="notice"] { color: #e8c08a; }
  .scroll-status[data-status="notice"]::before { animation: none; background: #e8b27a; box-shadow: none; }
  .scroll-status[data-status="error"] { color: #e8a08c; }
  .scroll-status[data-status="error"]::before { animation: none; background: #e46c4e; box-shadow: none; }
  @keyframes pulse { 50% { opacity: 0.4; } }
  @keyframes bar-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .scroll-progress {
    flex: 0 0 auto;
    font-size: 10px;
    line-height: 1.3;
    color: var(--muted);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .scroll-actions {
    --app-region: no-drag;
    display: flex;
    align-items: center;
    gap: 3px;
    flex: 0 0 auto;
  }
  .scroll-action {
    position: relative;
    display: flex;
    align-items: center;
    height: 21px;
    padding: 0 8px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: #f0ebe1;
    font: 500 10.5px/1 var(--font);
    white-space: nowrap;
    cursor: pointer;
    transition: background-color 120ms ease, color 120ms ease, opacity 120ms ease;
  }
  .scroll-action:hover { background: var(--panel2); }
  .scroll-action:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
  .scroll-action[data-scroll-action="mode"] { color: #e8c08a; }
  .scroll-action[data-scroll-action="mode"][aria-pressed="true"] { background: rgba(243, 162, 78, 0.16); color: #f6c78e; }
  .scroll-action[data-scroll-action="finish"] { background: var(--amber); color: #21170d; font-weight: 700; }
  .scroll-action[data-scroll-action="finish"]:hover { background: #ffb765; }
  .scroll-action[data-scroll-action="cancel"] { color: #e8a08c; }
  .scroll-action[data-scroll-action="cancel"]:hover { background: #3a2622; }
  .scroll-action:disabled { opacity: 0.4; cursor: default; background: transparent; color: var(--muted); }
  .scroll-action:disabled[data-scroll-action="finish"] { background: rgba(243, 162, 78, 0.4); color: #21170d; }

  .scroll-permission {
    --app-region: no-drag;
    flex: 1;
    min-width: 0;
    padding: 0;
    border: 0;
    background: none;
    color: #e8b27a;
    font: inherit;
    font-size: 10px;
    line-height: 1.3;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
  }
  .scroll-permission:hover { text-decoration: underline; text-underline-offset: 3px; }
  .scroll-permission:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; border-radius: 3px; }

  button.is-pending { cursor: progress; }
  button.is-pending::after {
    content: ""; position: absolute; top: -2px; right: -2px; width: 7px; height: 7px;
    border: 1.5px solid rgba(243, 162, 78, .3); border-top-color: #f3a24e; border-radius: 50%;
    animation: scroll-spin .7s linear infinite; pointer-events: none;
  }
  button.is-success::after {
    content: "✓"; position: absolute; top: -4px; right: -4px;
    min-width: 10px; height: 10px; padding: 0 2px; border-radius: 999px;
    background: #a8c7a0; color: #1c241a; font-size: 8px; font-weight: 800; line-height: 10px;
    text-align: center; animation: scroll-pop 150ms var(--ease-out) both; pointer-events: none;
  }
  @keyframes scroll-spin { to { transform: rotate(360deg); } }
  @keyframes scroll-pop { from { opacity: 0; transform: scale(.55); } to { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }
</style>
</head>
<body>
  <div class="scroll-bar" id="scrollBar">
    <div class="scroll-row">
      <span class="scroll-status" id="scrollStatus" data-status="running" role="status" aria-live="polite">正在准备滚动会话…</span>
      <span class="scroll-progress" id="scrollProgress">已拼接 0 帧 · 0 px</span>
    </div>
    <div class="scroll-row">
      <button type="button" class="scroll-permission" data-scroll-permission hidden>自动滚动需要辅助功能权限 · 去授权</button>
      <div class="scroll-actions" role="group" aria-label="滚动截图控制">
        <button type="button" class="scroll-action" data-scroll-action="pause" title="暂停 / 继续抓帧">暂停</button>
        <button type="button" class="scroll-action" data-scroll-action="mode" aria-pressed="false" title="开启自动滚动">自动滚动</button>
        <button type="button" class="scroll-action" data-scroll-action="finish" title="立即完成并预览">立即完成</button>
        <button type="button" class="scroll-action" data-scroll-action="cancel" title="取消本次滚动截图">取消</button>
      </div>
    </div>
  </div>
  <script type="module" src="/src/scroll.ts"></script>
</body>
</html>
