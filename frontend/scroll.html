<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pinstill — 滚动截图</title>
<style>
  :root {
    --amber: #f3a24e;
    --paper: #f2eee4;
    --panel: #201f1b;
    --panel2: #2f2d26;
    --muted: #9c9487;
    --font: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    color: var(--paper);
    user-select: none;
    -webkit-user-select: none;
    font-family: var(--font);
  }
  [hidden] { display: none !important; }

  /* The whole bar is the window's drag region (MyGo --app-region: drag). */
  .scroll-bar {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
    padding: 6px 9px;
    border: 1px solid rgba(242, 238, 228, 0.12);
    border-radius: 10px;
    background: var(--panel);
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.4);
    --app-region: drag;
  }
  .scroll-row {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }

  .scroll-progress {
    flex: 1;
    min-width: 0;
    font-size: 11px;
    line-height: 1.35;
    color: #f0ebe1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-variant-numeric: tabular-nums;
  }
  .scroll-progress::before {
    content: "";
    display: inline-block;
    width: 6px;
    height: 6px;
    margin-right: 6px;
    border-radius: 50%;
    background: var(--amber);
    vertical-align: 1px;
    box-shadow: 0 0 0 3px rgba(243, 162, 78, 0.16);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .scroll-progress[data-status="done"]::before,
  .scroll-progress[data-status="stalled"]::before,
  .scroll-progress[data-status="max"]::before,
  .scroll-progress[data-status="stopped"]::before { animation: none; background: #a8c7a0; box-shadow: none; }
  @keyframes pulse { 50% { opacity: 0.45; } }

  .scroll-toggle {
    --app-region: no-drag;
    display: flex;
    align-items: center;
    gap: 5px;
    flex: 0 0 auto;
    font-size: 11px;
    color: #d8d1c4;
    cursor: pointer;
  }
  .scroll-toggle input {
    appearance: none;
    width: 26px;
    height: 15px;
    margin: 0;
    border-radius: 8px;
    background: #4b473c;
    position: relative;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .scroll-toggle input::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #b9b1a3;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .scroll-toggle input:checked { background: #dfa15f; }
  .scroll-toggle input:checked::after { transform: translateX(11px); background: #261e13; }
  .scroll-toggle input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

  .scroll-hint {
    flex: 1;
    min-width: 0;
    font-size: 10px;
    line-height: 1.4;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .scroll-hint[data-kind="warn"] { color: #e8b27a; }
  .scroll-hint[data-kind="error"] { color: #e8a08c; }

  .scroll-permission {
    --app-region: no-drag;
    flex: 1;
    min-width: 0;
    padding: 0;
    border: 0;
    background: none;
    color: #e8b27a;
    font: inherit;
    font-size: 10px;
    line-height: 1.4;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: pointer;
  }
  .scroll-permission:hover { text-decoration: underline; text-underline-offset: 3px; }
  .scroll-permission:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; border-radius: 3px; }

  .scroll-actions {
    --app-region: no-drag;
    display: flex;
    align-items: center;
    gap: 2px;
    flex: 0 0 auto;
  }
  .scroll-action {
    display: flex;
    align-items: center;
    height: 23px;
    padding: 0 8px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: #f0ebe1;
    font: 500 11px/1 var(--font);
    white-space: nowrap;
    cursor: pointer;
  }
  .scroll-action:hover { background: var(--panel2); }
  .scroll-action:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
  .scroll-action.primary { background: var(--amber); color: #21170d; font-weight: 700; }
  .scroll-action.primary:hover { background: #ffb765; }
  .scroll-action.cancel { color: #e8a08c; }
  .scroll-action.cancel:hover { background: #3a2622; }
  .scroll-action:disabled { opacity: 0.4; cursor: default; background: transparent; color: #9c9487; }

  .scroll-bar.busy { cursor: default; }
</style>
</head>
<body>
  <div class="scroll-bar" id="scrollBar">
    <div class="scroll-row">
      <span class="scroll-progress" id="scrollProgress" role="status" aria-live="polite">正在准备滚动会话…</span>
      <label class="scroll-toggle" for="scrollAuto">
        <input id="scrollAuto" type="checkbox" aria-label="自动滚动" />
        <span>自动滚动</span>
      </label>
    </div>
    <div class="scroll-row">
      <span class="scroll-hint" id="scrollHint">请滚动目标窗口，Pinstill 会自动抓帧</span>
      <button type="button" class="scroll-permission" id="scrollPermission" hidden>需要「辅助功能」权限 · 点此打开系统设置</button>
      <div class="scroll-actions" id="scrollActions" role="group" aria-label="滚动截图动作"></div>
    </div>
  </div>
  <script type="module" src="/src/scroll.ts"></script>
</body>
</html>
