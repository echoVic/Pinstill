<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pinstill — 翻译</title>
<style>
  :root {
    --bg: #141412; --panel: #201f1b; --panel2: #282722; --paper: #f2eee4;
    --muted: #9c9487; --amber: #f3a24e; --line: rgba(242, 238, 228, .12);
    --font: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--paper); font-family: var(--font); user-select: none; }
  .titlebar { height: 44px; --app-region: drag; display: flex; align-items: center; padding: 0 18px 0 90px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  main { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px 14px; padding: 0 18px 16px; height: calc(100% - 44px); }
  .pane { display: flex; flex-direction: column; gap: 6px; min-height: 0; }
  .langbar { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .footer { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .field { position: relative; display: flex; flex: 1; min-height: 0; }
  .field textarea { flex: 1; padding-bottom: 42px; }
  .inline-action { position: absolute; right: 10px; bottom: 10px; font-size: 11px; padding: 4px 10px; background: rgba(32, 31, 27, .88); }
  .pane label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  textarea { flex: 1; width: 100%; min-height: 0; resize: none; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--paper); padding: 12px; font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; outline: none; user-select: text; -webkit-user-select: text; }
  textarea:focus { border-color: rgba(243, 162, 78, .55); }
  textarea[readonly] { background: var(--panel2); }
  .controls { display: flex; align-items: center; gap: 8px; }
  select { background: var(--panel); color: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 12px; }
  button { font: inherit; font-size: 12px; border-radius: 8px; padding: 7px 14px; border: 1px solid var(--line); background: var(--panel); color: var(--paper); cursor: pointer; }
  button:hover { background: var(--panel2); }
  button.primary { background: var(--amber); border-color: transparent; color: #201a12; font-weight: 600; }
  .swap { padding: 6px 9px; font-size: 14px; line-height: 1; }
  button:disabled { opacity: .55; cursor: default; }
  .actions { display: flex; align-items: center; gap: 8px; min-height: 30px; }
  #status { flex: 1; font-size: 12px; color: var(--muted); }
  #status.error { color: #e08a6a; }
</style>
</head>
<body>
  <div class="titlebar">翻译</div>
  <main>
    <div class="langbar">
      <select id="source-lang" aria-label="源语言"></select>
      <button id="swap" class="swap" type="button" title="交换源语言和目标语言" aria-label="交换语言">⇄</button>
      <select id="target" aria-label="目标语言"></select>
    </div>
    <section class="pane">
      <label for="source">原文</label>
      <textarea id="source" spellcheck="false" placeholder="粘贴或输入要翻译的文字，⌘V 粘贴，⌘↩ 开始"></textarea>
    </section>
    <section class="pane">
      <label for="result">译文</label>
      <div class="field">
        <textarea id="result" readonly placeholder="译文会逐段出现在这里"></textarea>
        <button id="copy-result" class="inline-action" type="button">复制</button>
      </div>
    </section>
    <div class="footer">
      <div class="controls">
        <button id="translate" class="primary" type="button">翻译</button>
        <button id="clear" type="button">清空</button>
      </div>
      <div class="actions">
        <span id="status" role="status"></span>
        <button id="copy-both" type="button">复制对照</button>
      </div>
    </div>
  </main>
  <script type="module" src="/src/translate.ts"></script>
</body>
</html>
