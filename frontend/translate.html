<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pinstill — 翻译</title>
<style>
  :root {
    --bg: #141412; --panel: #201f1b; --panel2: #282722; --paper: #f2eee4;
    --muted: #9c9487; --amber: #f3a24e; --line: rgba(242, 238, 228, .12);
    --font: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--paper); font-family: var(--font); user-select: none; }
  [hidden] { display: none !important; }
  .titlebar { height: 44px; --app-region: drag; display: flex; align-items: center; justify-content: space-between; padding: 0 14px 0 90px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .titlebar-actions { --app-region: no-drag; display: flex; align-items: center; gap: 6px; letter-spacing: normal; text-transform: none; }
  .titlebar-select { background: var(--panel); color: var(--paper); border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px; font: inherit; font-size: 11px; max-width: 150px; }
  .pin-toggle { font-size: 11px; padding: 4px 9px; border-radius: 7px; color: var(--muted); }
  .pin-toggle.is-pinned { background: rgba(243, 162, 78, .14); border-color: rgba(243, 162, 78, .5); color: var(--amber); font-weight: 600; }
  main { position: relative; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px 14px; padding: 0 18px 16px; height: calc(100% - 44px); }
  .pane { display: flex; flex-direction: column; gap: 6px; min-height: 0; }
  .pane-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .pane-head label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .char-count { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .langbar { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .langbar-sep { width: 1px; height: 16px; background: var(--line); margin: 0 2px; }
  .footer { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .field { position: relative; display: flex; flex: 1; min-height: 0; }
  .field textarea { flex: 1; padding-bottom: 42px; }
  .field.is-streaming textarea { border-color: rgba(243, 162, 78, .45); }
  .field.is-dragover textarea { border-color: var(--amber); border-style: dashed; background: #26241f; }
  .drop-hint { position: absolute; inset: 10px; display: none; place-items: center; border-radius: 8px; background: rgba(20, 20, 18, .72); color: var(--amber); font-size: 12px; pointer-events: none; }
  .field.is-dragover .drop-hint { display: grid; }
  .inline-actions { position: absolute; right: 10px; bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .inline-btn { font-size: 11px; padding: 4px 9px; background: rgba(32, 31, 27, .9); }
  .inline-btn.is-active { border-color: rgba(243, 162, 78, .55); color: var(--amber); background: rgba(243, 162, 78, .14); }
  .star-btn { padding: 4px 8px; color: var(--muted); }
  .star-btn.is-starred { color: var(--amber); border-color: rgba(243, 162, 78, .5); background: rgba(243, 162, 78, .12); }
  .speak-btn.is-speaking { border-color: rgba(243, 162, 78, .55); color: var(--amber); background: rgba(243, 162, 78, .14); font-weight: 600; }
  textarea { flex: 1; width: 100%; min-height: 0; resize: none; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--paper); padding: 12px; font: 13px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; outline: none; user-select: text; -webkit-user-select: text; transition: border-color 140ms ease; }
  textarea:focus { border-color: rgba(243, 162, 78, .55); }
  textarea[readonly] { background: var(--panel2); }
  .controls { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  select { background: var(--panel); color: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 12px; }
  select:disabled { opacity: .45; cursor: not-allowed; }
  button { position: relative; font: inherit; font-size: 12px; border-radius: 8px; padding: 7px 14px; border: 1px solid var(--line); background: var(--panel); color: var(--paper); cursor: pointer; transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease, opacity 120ms ease; }
  button:hover { background: var(--panel2); }
  button:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  button.primary { background: var(--amber); border-color: transparent; color: #201a12; font-weight: 600; }
  button.primary:hover { background: #f3b878; }
  button.is-stop { background: #332520; border-color: rgba(224, 138, 106, .42); color: #f0a388; font-weight: 600; }
  button.is-stop:hover { background: #402c25; border-color: rgba(224, 138, 106, .6); }
  .link-action { padding: 5px 10px; font-size: 11px; color: var(--amber); border-color: rgba(243, 162, 78, .35); background: rgba(243, 162, 78, .08); flex: 0 0 auto; }
  .link-action:hover { background: rgba(243, 162, 78, .16); border-color: rgba(243, 162, 78, .55); }
  .swap { padding: 6px 9px; font-size: 14px; line-height: 1; }
  button:disabled { opacity: .55; cursor: default; }
  button.is-pending { cursor: progress; }
  button.is-pending::after {
    content: ""; position: absolute; top: -4px; right: -4px; width: 9px; height: 9px;
    border: 2px solid rgba(243, 162, 78, .32); border-top-color: #f3a24e; border-radius: 50%;
    animation: translate-spin .7s linear infinite; pointer-events: none;
  }
  button.is-success::after {
    content: "✓"; position: absolute; top: -5px; right: -5px; min-width: 12px; height: 12px;
    padding: 0 3px; border-radius: 999px; background: #a8c7a0; color: #1c241a;
    font-size: 9px; font-weight: 800; line-height: 12px; text-align: center;
    animation: translate-pop 150ms cubic-bezier(.22,.61,.36,1) both; pointer-events: none;
  }
  .actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; min-height: 30px; min-width: 0; flex: 1; }
  #status { display: inline-flex; align-items: center; justify-content: flex-end; gap: 6px; min-width: 0; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status.error { color: #e08a6a; }
  #status.is-loading::before {
    content: ""; width: 10px; height: 10px; flex: 0 0 10px;
    border: 1.5px solid rgba(242, 238, 228, .22); border-top-color: var(--amber); border-radius: 50%;
    animation: translate-spin .75s linear infinite;
  }
  .history-drawer {
    position: fixed; top: 44px; right: 0; bottom: 0; width: min(360px, 88vw);
    background: #1b1a16; border-left: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 10px; padding: 12px 14px;
    box-shadow: -16px 0 36px rgba(0, 0, 0, .48); z-index: 20;
  }
  .history-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .history-tabs { display: flex; align-items: center; gap: 6px; }
  .history-tab { font-size: 11px; padding: 4px 10px; border-radius: 7px; color: var(--muted); }
  .history-tab.is-active { background: rgba(243, 162, 78, .15); border-color: rgba(243, 162, 78, .5); color: var(--amber); font-weight: 600; }
  .history-tools { display: flex; align-items: center; gap: 6px; }
  .history-search { width: 100%; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--paper); padding: 7px 10px; font: inherit; font-size: 12px; outline: none; }
  .history-search:focus { border-color: rgba(243, 162, 78, .55); }
  .history-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .history-empty { margin: 24px 0; text-align: center; font-size: 12px; color: var(--muted); }
  .history-item { display: flex; flex-direction: column; gap: 4px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); cursor: pointer; }
  .history-item:hover { background: var(--panel2); border-color: rgba(243, 162, 78, .38); }
  .history-item-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .history-item-meta { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .history-item-actions { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
  .history-item-actions button { padding: 2px 6px; font-size: 11px; border-radius: 6px; }
  .history-item-source, .history-item-result { font-size: 12px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .history-item-source { color: var(--paper); }
  .history-item-result { color: var(--muted); }
  @keyframes translate-spin { to { transform: rotate(360deg); } }
  @keyframes translate-pop { from { opacity: 0; transform: scale(.55); } to { opacity: 1; transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }
</style>
</head>
<body>
  <div class="titlebar">
    <span>翻译</span>
    <div class="titlebar-actions">
      <button id="history-toggle" class="pin-toggle" type="button" aria-pressed="false" title="查看翻译历史与收藏">历史</button>
      <select id="model-preset" class="titlebar-select" aria-label="模型预设" hidden></select>
      <button id="pin-window" class="pin-toggle" type="button" aria-pressed="false" title="窗口置顶">置顶</button>
    </div>
  </div>
  <main>
    <div class="langbar">
      <select id="source-lang" aria-label="源语言"></select>
      <button id="swap" class="swap" type="button" title="交换源语言和目标语言" aria-label="交换语言">⇄</button>
      <select id="target" aria-label="目标语言"></select>
      <span class="langbar-sep" aria-hidden="true"></span>
      <select id="style" aria-label="翻译风格" disabled title="配置大模型服务后可选择翻译风格"></select>
    </div>
    <section class="pane">
      <div class="pane-head">
        <label for="source">原文</label>
        <span class="char-count" id="source-count"></span>
      </div>
      <div class="field" id="source-field">
        <textarea id="source" spellcheck="false" placeholder="粘贴或输入文字，也可粘贴/拖入图片，⌘↩ 开始"></textarea>
        <div class="drop-hint" aria-hidden="true">松开以识别图片文字并翻译</div>
        <div class="inline-actions">
          <button id="speak-source" class="inline-btn speak-btn" type="button" aria-pressed="false" title="朗读原文" disabled>朗读</button>
          <button id="auto-merge" class="inline-btn" type="button" aria-pressed="false" title="粘贴文字或识别图片时自动合并多余换行">自动合行</button>
          <button id="merge-lines" class="inline-btn" type="button" title="合并 PDF、终端或截图复制产生的多余换行">合并断行</button>
        </div>
      </div>
    </section>
    <section class="pane">
      <div class="pane-head">
        <label for="result">译文</label>
        <span class="char-count" id="result-count"></span>
      </div>
      <div class="field" id="result-field">
        <textarea id="result" readonly placeholder="译文会逐段出现在这里"></textarea>
        <div class="inline-actions">
          <button id="speak-result" class="inline-btn speak-btn" type="button" aria-pressed="false" title="朗读译文" disabled>朗读</button>
          <button id="star-result" class="inline-btn star-btn" type="button" aria-pressed="false" title="收藏当前译文" disabled>☆</button>
          <button id="copy-result" class="inline-btn" type="button">复制</button>
        </div>
      </div>
    </section>
    <div class="footer">
      <div class="controls">
        <button id="translate" class="primary" type="button">翻译</button>
        <button id="clear" type="button">清空</button>
      </div>
      <div class="actions">
        <span id="status" role="status" aria-live="polite"></span>
        <button id="open-settings" class="link-action" type="button" hidden>前往设置</button>
        <button id="copy-both" type="button">复制对照</button>
      </div>
    </div>
  </main>
  <aside id="history-drawer" class="history-drawer" hidden aria-label="翻译历史与收藏">
    <div class="history-head">
      <div class="history-tabs">
        <button id="history-tab-all" class="history-tab is-active" type="button">全部</button>
        <button id="history-tab-starred" class="history-tab" type="button">收藏</button>
      </div>
      <div class="history-tools">
        <button id="history-record-toggle" class="history-tab is-active" type="button" aria-pressed="true" title="开关自动记录翻译历史">记录</button>
        <button id="history-clear" class="history-tab" type="button" title="清空未收藏的记录">清空</button>
        <button id="history-close" class="history-tab" type="button" aria-label="关闭历史">×</button>
      </div>
    </div>
    <input id="history-search" class="history-search" type="search" placeholder="搜索原文或译文…" aria-label="搜索翻译历史" />
    <div id="history-list" class="history-list"></div>
  </aside>
  <script type="module" src="/src/translate.ts"></script>
</body>
</html>
